name: Publish verified signed release

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Signed release candidates run from main
        required: true
        type: string
      release_tag:
        description: New package version tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: verified-release-publication
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify signed run, exact packages and committed owner evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python scripts/publish_release.py --check

  publish:
    needs: preflight
    if: github.ref == 'refs/heads/main'
    environment: release-publication
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recheck exact evidence, verify draft assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python scripts/publish_release.py
